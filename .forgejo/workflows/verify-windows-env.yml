name: Test Windows Cross Compile Dependencies

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify-win-env:
    name: 01.01 Verify Windows Environment
    runs-on: win-linux-cross
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check for pwsh (PowerShell Core 7+)
        shell: pwsh
        run: |
          Write-Host "PowerShell Core is working!"
          $PSVersionTable

      # Automatically find the active nvm symlink or falls back to the latest installed Node version on the machine and adds it to $env:GITHUB_PATH
      - name: Configure Node.js from nvm-windows
        if: always()
        shell: powershell
        run: |
          # 1. Check standard nvm-windows symlink locations first
          $symlinkPaths = @(
            $env:NVM_SYMLINK,
            "C:\nvm4w\nodejs",
            "C:\Program Files\nodejs"
          ) | Where-Object { $_ -and (Test-Path "$_\node.exe") }

          if ($symlinkPaths.Count -gt 0) {
            $nodeDir = $symlinkPaths[0]
          } else {
            # 2. Fallback: Search nvm root directories for any installed version
            $nvmRoots = @($env:NVM_HOME, "C:\Users\$env:USERNAME\AppData\Local\nvm", "C:\nvm4w") | Where-Object { $_ -and (Test-Path $_) }
            $nodeExe = Get-ChildItem -Path $nvmRoots -Filter "node.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($nodeExe) {
              $nodeDir = $nodeExe.DirectoryName
            }
          }

          if ($nodeDir) {
            Write-Host "Found Node.js at: $nodeDir"
            "$nodeDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "Could not locate node.exe in any nvm-windows directory."
            exit 1
          }

      - name: Refresh PATH and check Node.js
        run: |
          node -v
          npm -v

      - name: Check for Python 3.12.10
        run: |
          $version = (python --version 2>&1).ToString().Trim()
          if ($version -ne "Python 3.12.10") {
            Write-Error "Expected 'Python 3.12.10', got '$version'"
            exit 1
          }
          Write-Host "Found: $version"
          
      - name: Add Python Scripts to PATH
        shell: pwsh
        run: |
          $scriptsDir = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $userScriptsDir = python -c "import sysconfig; print(sysconfig.get_path('scripts', 'nt_user'))"
          "$scriptsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$userScriptsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check for Cppcheck
        run: |
          if (-not (Get-Command cppcheck -ErrorAction SilentlyContinue)) {
            Write-Error "cppcheck is not a valid command"
            exit 1
          }
          Write-Host "Found: $(cppcheck --version)"

      - name: Check for Lizard
        run: |
          if (-not (Get-Command lizard -ErrorAction SilentlyContinue)) {
            Write-Error "lizard is not a valid command"
            exit 1
          }
          Write-Host "Found: Lizard $(lizard --version)"

      - name: Check for OpenCppCoverage
        run: |
          if (-not (Get-Command OpenCppCoverage -ErrorAction SilentlyContinue)) {
            Write-Error "OpenCppCoverage is not a valid command"
            exit 1
          }
          Write-Host "Found: OpenCppCoverage"

      - name: Check for Codecov-CLI
        run: |
          if (-not (Get-Command codecovcli -ErrorAction SilentlyContinue)) {
            Write-Error "codecovcli is not a valid command"
            exit 1
          }
          Write-Host "Found: $(codecovcli --version)"

