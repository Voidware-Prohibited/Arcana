name: Dev CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
      - 'v*'

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "System.Core"
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  step-1-verify-windows-env:
    name: 01 Verify Environment
    uses: ./.forgejo/workflows/verify-windows-env.yml

  win-linux:
    uses: ./.forgejo/workflows/win-linux.yaml
    with:
      plugin_name: Arcana
      ue_win_path: 'D:\DEV\UE5\UE_5.8'
      run_cook: true
      upload_artifacts: false
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos:
    uses: ./.forgejo/workflows/macos.yaml
    with:
      plugin_name: Arcana
      ue_mac_path: '/Users/Shared/Epic Games/UE_5.8'
      upload_artifacts: false
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

  step-3-generate-and-publish-documentation:
    needs: step-2-build
    name: 03 Publish Documentation
    uses: ./.forgejo/workflows/publish-doxygen.yml
    secrets: inherit

  step-4-publish-wiki:
    needs: step-2-build
    name: 04 Publish Wiki
    uses: ./.forgejo/workflows/publish-wiki.yml
    secrets: inherit
