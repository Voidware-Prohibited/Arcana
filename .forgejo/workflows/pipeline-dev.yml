name: Dev CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
      - 'v*'

jobs:
  step-1-test-environment:
    name: Test Environment for Dependencies
    uses: ./.forgejo/workflows/test-win-dependencies.yml

  step-2-deploy:
    needs: step-1-test-environment
    name: Build, Test, Cook, Package and Update Status
    uses: ./.forgejo/workflows/ue-plugin-ci.yml
    secrets: inherit # Passes repository secrets down to the called workflow
