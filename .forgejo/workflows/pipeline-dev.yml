name: Dev CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
      - 'v*'

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  step-1-verify-windows-env:
    name: Step 01 Verify Windows Environment
    uses: ./.forgejo/workflows/verify-windows-env.yml

  step-2-build:
    needs: step-1-verify-windows-env
    name: Step 02 Build, Test, Cook, Package and Update Status
    uses: ./.forgejo/workflows/ue-plugin-ci.yml
    secrets: inherit

  step-3-generate-and-publish-documentation:
    needs: step-2-build
    name: Step 03 Publish Documentation
    uses: ./.forgejo/workflows/publish-doxygen.yml
    secrets: inherit

  step-4-publish-wiki:
    needs: step-2-build
    name: Step 04 Publish Wiki
    uses: ./.forgejo/workflows/publish-wiki.yml
    secrets: inherit
