name: Dev CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
      - 'v*'

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  step-1-test-environment:
    name: Test Environment for Dependencies
    uses: ./.forgejo/workflows/test-win-dependencies.yml

  step-2-deploy:
    needs: step-1-test-environment
    name: Build, Test, Cook, Package and Update Status
    uses: ./.forgejo/workflows/ue-plugin-ci.yml
    secrets: inherit
    variables: inherit
