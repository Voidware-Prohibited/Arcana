# This Pipeline Workflow is intended for use in a local cluster of preconfigured containerless host machines. This is to reduce computation and improve the overall speed of the CI/CD/TDD process. 
# Runners for these workflows are required to be preconfigured and to be run as a containerless Host by appending ":host" to its label. 

name: Dev CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
      - 'v*'

env:
  PRIMARY_UE_VERSION: "5.8"
  SECONDARY_UE_VERSIONS: '["5.6", "5.7"]'
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "System.Core"
  WIN_UE_BASE_PATH: 'D:\DEV\UE5'
  MAC_UE_BASE_PATH: "/Users/Shared/Epic Games"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  step-1-verify-windows-env:
    name: 01 Verify Environment
    uses: ./.forgejo/workflows/verify-windows-env.yml

  win-linux-primary:
    name: 02a Build & Test Win64/Linux Primary (UE 5.8)
    uses: ./.forgejo/workflows/win-linux.yml
    with:
      plugin_name: Arcana
      ue_versions: '["5.8"]'
      primary_ue_version: "5.8"
      ue_win_base_path: 'D:\DEV\UE5'
      tests_filter: "System.Core"
      run_cook: true
      upload_artifacts: false
      enable_platform: true
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  win-linux-secondary:
    name: 02b Build Win64/Linux Secondary (UE 5.6 & 5.7)
    needs: [ win-linux-primary ]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.forgejo/workflows/win-linux.yml
    with:
      plugin_name: Arcana
      ue_versions: '["5.6", "5.7"]'
      primary_ue_version: "5.8"
      ue_win_base_path: 'D:\DEV\UE5'
      tests_filter: "System.Core"
      run_cook: true
      upload_artifacts: false
      enable_platform: true
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # macos-primary:
  #   name: 03a Build & Test macOS Primary (UE 5.8)
  #   uses: ./.forgejo/workflows/macos.yml
  #   with:
  #     plugin_name: Arcana
  #     ue_versions: '["5.8"]'
  #     primary_ue_version: "5.8"
  #     ue_mac_base_path: "/Users/Shared/Epic Games"
  #     tests_filter: "System.Core"
  #     upload_artifacts: false
  #     enable_platform: true
  #   secrets:
  #     FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
# 
  # macos-secondary:
  #   name: 03b Build macOS Secondary (UE 5.6 & 5.7)
  #   needs: [ macos-primary ]
  #   if: ${{ !failure() && !cancelled() }}
  #   uses: ./.forgejo/workflows/macos.yml
  #   with:
  #     plugin_name: Arcana
  #     ue_versions: '["5.6", "5.7"]'
  #     primary_ue_version: "5.8"
  #     ue_mac_base_path: "/Users/Shared/Epic Games"
  #     tests_filter: "System.Core"
  #     upload_artifacts: false
  #     enable_platform: true
  #   secrets:
  #     FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

  step-3-generate-and-publish-documentation:
    needs: [ win-linux-primary, win-linux-secondary ]
    if: ${{ !failure() && !cancelled() }}
    name: 04 Publish Documentation
    uses: ./.forgejo/workflows/publish-doxygen.yml
    secrets: inherit

  step-4-publish-wiki:
    needs: [ win-linux-primary, win-linux-secondary ]
    if: ${{ !failure() && !cancelled() }}
    name: 05 Publish Wiki
    uses: ./.forgejo/workflows/publish-wiki.yml
    secrets: inherit
