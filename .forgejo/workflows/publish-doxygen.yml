name: Deploy Doxygen to External Repo

on:
  workflow_call:
  workflow_dispatch:

jobs:
  generate-doxygen-remote:
    runs-on: linux
    steps:
      # 1. Checkout the source code
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Install Doxygen and dependencies
      - name: Install Doxygen
        run: |
          apt-get update
          apt-get install "-y" doxygen graphviz git

      # 3. Generate HTML Documentation
      - name: Generate Docs
        run: |
          # Clone the Doxygen Awesome CSS repository
          git clone --depth=1 https://github.com/jothepro/doxygen-awesome-css.git

          # Clone the Voidware DoxygenSharedTemplateFiles repository
          git clone --depth=1 https://codeberg.org/Voidware-Prohibited/DoxygenSharedTemplateFiles.git

          sed -i "s/__GEN_DATE__/$(date '+%m-%d-%Y %I:%M:%S')/g" DoxygenSharedTemplateFiles/footer.html

          # Dynamically append theme settings to your Doxyfile
          echo "HTML_EXTRA_STYLESHEET  += doxygen-awesome-css/doxygen-awesome.css DoxygenSharedTemplateFiles/stylesheet.css DoxygenSharedTemplateFiles/custom_menu.css" >> Doxyfile
          
          # Optional: Include interactive extensions (like the Dark Mode toggle)
          echo "HTML_EXTRA_FILES       += doxygen-awesome-css/doxygen-awesome-darkmode-toggle.js DoxygenSharedTemplateFiles/custom_menu.js" >> Doxyfile
          echo "HTML_HEADER            = DoxygenSharedTemplateFiles/header.html" >> Doxyfile 
          echo "HTML_FOOTER            = DoxygenSharedTemplateFiles/footer.html" >> Doxyfile

          # Run doxygen as usual
          doxygen Doxyfile

      # 4. Deploy to External Repository (Replaced with native Git operations)
      - name: Deploy to Target Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ vars.GHPAGES_REPO }}
          TARGET_BRANCH: main
          LOCAL_FOLDER: docs        # Your Doxygen output directory
          TARGET_FOLDER: docs       # Subdirectory inside the target repo
        run: |
          # 1. Configure a temporary workspace for the deployment clone
          mkdir -p ../remote-repo
          
          # 2. Clone the external target repository into the temporary workspace
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" ../remote-repo
          
          # 3. Create the target subdirectory if it doesn't exist, and sync the fresh documentation
          mkdir -p "../remote-repo/${TARGET_FOLDER}"
          cp -R ${LOCAL_FOLDER}/* "../remote-repo/${TARGET_FOLDER}/"
          
          # 4. Navigate into the cloned repository, stage changes, commit, and push
          cd ../remote-repo
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.github.com"
          
          git add "${TARGET_FOLDER}/*"
          
          # Only commit and push if changes exist to avoid empty commit workflow failures
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: automated update of Doxygen documentation"
            git push origin ${TARGET_BRANCH}
          else
            echo "No changes to documentation detected. Skipping push."
          fi
