name: UE 5.8 Plugin Build & Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

# Top-level configuration variables
env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  # Use forward slashes for Git Bash compatibility on Windows
  WIN_UE_ROOT: "D:/DEV/UE5/UE_5.8"
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: "C:/Program Files/OpenCppCoverage/OpenCppCoverage.exe"
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (Native)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Win64
            run_coverage: true
            run_linux_tests: false

          - name: "Linux (Cross-Compiled on Windows)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Linux
            run_coverage: false
            run_linux_tests: true

          - name: "macOS (Native)"
            os: macos
            runs-on: macos
            target_platform: Mac
            run_coverage: false
            run_linux_tests: false

    steps:
      - name: Install unzip
        run: apt-get update && apt-get install -y unzip
      - name: Install Git LFS
        run: apt update && apt install -y git git-lfs && git lfs install

      # 1. Checkout Plugin Code
      - name: Checkout Plugin Code
        uses: actions/checkout@v4
        with:
          path: plugin-src
          lfs: true

      - name: Install MSYS2 archive
        shell: bash
        run: |
          curl -fSL -o msys2.tar.xz https://msys2.org
          tar -xJf msys2.tar.xz -C /c
          rm msys2.tar.xz
          echo "/c/msys64/usr/bin" >> "$GITHUB_PATH"

      # 2. Build Plugin via RunUAT (Unified Windows & macOS)
      - name: Build Plugin
        run: |
          if [ "${{ matrix.os }}" == "windows" ]; then
            RUN_UAT="$WIN_UE_ROOT/Engine/Build/BatchFiles/RunUAT.bat"
            WORK_DIR=$(cygpath -w "$PWD")
            PLUGIN_FILE="$WORK_DIR\\plugin-src\\$PLUGIN_NAME.uplugin"
            PACKAGE_DIR="$WORK_DIR\\packaged-plugin"
          else
            RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
            PLUGIN_FILE="$PWD/plugin-src/$PLUGIN_NAME.uplugin"
            PACKAGE_DIR="$PWD/packaged-plugin"
          fi

          "$RUN_UAT" BuildPlugin \
            -Plugin="$PLUGIN_FILE" \
            -Package="$PACKAGE_DIR" \
            -TargetPlatforms=${{ matrix.target_platform }} \
            -Rocket

      # 3. Create Blank C++ Host Project & Install Packaged Plugin (Unified)
      - name: Create Host Project
        run: |
          HOST_DIR="$PWD/HostProject"
          mkdir -p "$HOST_DIR/Plugins/$PLUGIN_NAME"
          cp -R "$PWD/packaged-plugin/"* "$HOST_DIR/Plugins/$PLUGIN_NAME/"

          cat <<EOF > "$HOST_DIR/HostProject.uproject"
          {
            "FileVersion": 3,
            "EngineAssociation": "$UE_VERSION",
            "Category": "",
            "Description": "",
            "Plugins": [
              {
                "Name": "$PLUGIN_NAME",
                "Enabled": true
              }
            ]
          }
          EOF

      # 4a. Run UAT Automation Tests + OpenCppCoverage (Native Windows Only)
      - name: Run UAT Automation Tests & OpenCppCoverage (Native Windows)
        if: matrix.run_coverage == true
        run: |
          WORK_DIR=$(cygpath -w "$PWD")
          RUN_UAT="$WIN_UE_ROOT/Engine/Build/BatchFiles/RunUAT.bat"
          PROJECT_FILE="$WORK_DIR\\HostProject\\HostProject.uproject"
          REPORT_DIR="$WORK_DIR\\TestReports"
          COVERAGE_FILE="$WORK_DIR\\coverage.xml"
          SOURCES_DIR="$WORK_DIR\\HostProject\\Plugins\\$PLUGIN_NAME\\Source"
          mkdir -p "$PWD/TestReports"

          # MSYS_NO_PATHCONV prevents Git Bash from mangling Windows flags/paths
          MSYS_NO_PATHCONV=1 "$OPENCPP_PATH" \
            --sources="$SOURCES_DIR" \
            --modules="UnrealEditor-$PLUGIN_NAME*.dll" \
            --export_type="cobertura:$COVERAGE_FILE" \
            --cover_children \
            -- \
            "$RUN_UAT" RunUnreal \
              -project="$PROJECT_FILE" \
              -platform=Win64 \
              -configuration=Development \
              -build=editor \
              -test=UE.EditorAutomation \
              -RunTest="$TESTS_FILTER" \
              -ReportExportPath="$REPORT_DIR" \
              -unattended -nop4 -nosplash -nullrhi

      # 4b. Run Automated Tests (Linux Cross-Compiled on Windows via WSL2)
      - name: Run Automated Tests (Linux via WSL2)
        if: matrix.run_linux_tests == true
        run: |
          WORK_DIR=$(cygpath -w "$PWD")
          RUN_UAT="$WIN_UE_ROOT/Engine/Build/BatchFiles/RunUAT.bat"
          PROJECT_FILE="$WORK_DIR\\HostProject\\HostProject.uproject"
          REPORT_DIR="$WORK_DIR\\TestReports"
          mkdir -p "$PWD/TestReports"

          MSYS_NO_PATHCONV=1 "$RUN_UAT" BuildCookRun \
            -project="$PROJECT_FILE" \
            -platform=Linux \
            -clientconfig=Development \
            -build -cook -stage -pak -unattended -nop4

          WSL_PROJECT_PATH=$(wsl wslpath -a "$PROJECT_FILE")
          WSL_REPORT_PATH=$(wsl wslpath -a "$REPORT_DIR")
          WSL_BIN_PATH=$(wsl wslpath -a "$WORK_DIR\\HostProject\\Saved\\StagedBuilds\\Linux\\HostProject\\Binaries\\Linux\\HostProject")

          MSYS_NO_PATHCONV=1 wsl "$WSL_BIN_PATH" \
            "$WSL_PROJECT_PATH" \
            -ExecCmds="Automation RunTests $TESTS_FILTER; Quit" \
            -ReportExportPath="$WSL_REPORT_PATH" \
            -unattended -nop4 -nosplash -nullrhi

      # 4c. Run Automated Tests (macOS)
      - name: Run Automated Tests (macOS)
        if: matrix.os == 'macos'
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PROJECT_FILE="$PWD/HostProject/HostProject.uproject"
          REPORT_DIR="$PWD/TestReports"
          mkdir -p "$REPORT_DIR"

          "$RUN_UAT" RunUnreal \
            -project="$PROJECT_FILE" \
            -platform=Mac \
            -configuration=Development \
            -build=editor \
            -test=UE.EditorAutomation \
            -RunTest="$TESTS_FILTER" \
            -ReportExportPath="$REPORT_DIR" \
            -unattended -nop4 -nosplash -nullrhi

      # 5. Upload Artifacts
      - name: Upload Build & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_platform }}-Build-And-Reports
          path: |
            packaged-plugin/
            TestReports/
            coverage.xml

      # 6. Upload Coverage to Codecov (Native Windows Only)
      - name: Upload Coverage to Codecov
        if: matrix.run_coverage == true && success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: windows-ue58
          fail_ci_if_error: true

      # 7. Update Commit Status on Forgejo
      - name: Update Forgejo Commit Status
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATE="success"
            DESC="UE $UE_VERSION build and tests passed on ${{ matrix.target_platform }}"
          else
            STATE="failure"
            DESC="UE $UE_VERSION build or tests failed on ${{ matrix.target_platform }}"
          fi

          curl -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"state\": \"$STATE\",
              \"target_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"description\": \"$DESC\",
              \"context\": \"ci/ue-${{ matrix.target_platform }}\"
            }"
