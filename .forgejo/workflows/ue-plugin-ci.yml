name: UE 5.8 Plugin Build & Test

on:
  workflow_call:
  workflow_dispatch:

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (Native)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Win64
            run_coverage: true
            run_linux_tests: false

          - name: "Linux (Cross-Compiled on Windows)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Linux
            run_coverage: false
            run_linux_tests: true

          - name: "macOS (Native)"
            os: macos
            runs-on: macos
            target_platform: Mac
            run_coverage: false
            run_linux_tests: false

    steps:
      # 0. Install Dependencies (Native per OS)
      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          if (-not (Get-Command git-lfs -ErrorAction SilentlyContinue)) {
            winget install -e --id GitHub.GitLFS --accept-package-agreements --accept-source-agreements
          }
          git lfs install

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          if ! command -v git-lfs &> /dev/null; then
            brew install git-lfs
          fi
          git lfs install

      # 1. Checkout Plugin Code
      - name: Checkout Plugin Code
        shell: powershell
        run: |
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}.git"
          $authUrl = $repoUrl -replace "https://", "https://oauth2:${{ secrets.GITHUB_TOKEN }}@"
          
          git clone --depth 1 --no-checkout $authUrl plugin-src
          Set-Location plugin-src
          
          git lfs install --local
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
          git lfs pull

      # 2a. Build Plugin via RunUAT (Windows)
      - name: Build Plugin (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $uatPath = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $pluginPath = Join-Path $PWD "plugin-src\$($env:PLUGIN_NAME).uplugin"
          $packagePath = Join-Path $PWD "packaged-plugin"

          & $uatPath BuildPlugin `
            -Plugin="$pluginPath" `
            -Package="$packagePath" `
            -TargetPlatforms=${{ matrix.target_platform }} `
            -Rocket

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 2b. Build Plugin via RunUAT (macOS)
      - name: Build Plugin (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PLUGIN_FILE="$PWD/plugin-src/$PLUGIN_NAME.uplugin"
          PACKAGE_DIR="$PWD/packaged-plugin"

          "$RUN_UAT" BuildPlugin \
            -Plugin="$PLUGIN_FILE" \
            -Package="$PACKAGE_DIR" \
            -TargetPlatforms=${{ matrix.target_platform }} \
            -Rocket

      # 3a. Create Blank C++ Host Project (Windows)
      - name: Create Host Project (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $pluginDest = Join-Path $PWD "HostProject\Plugins\$($env:PLUGIN_NAME)"
          New-Item -ItemType Directory -Path $pluginDest -Force | Out-Null

          $packagedSrc = Join-Path $PWD "packaged-plugin\*"
          Copy-Item -Path $packagedSrc -Destination $pluginDest -Recurse -Force

          $uprojectObj = [ordered]@{
            FileVersion       = 3
            EngineAssociation = $env:UE_VERSION
            Category          = ""
            Description       = ""
            Plugins           = @(
              [ordered]@{
                Name    = $env:PLUGIN_NAME
                Enabled = $true
              }
            )
          }

          $uprojectPath = Join-Path $PWD "HostProject\HostProject.uproject"
          $jsonContent = $uprojectObj | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText($uprojectPath, $jsonContent)

      # 3b. Create Blank C++ Host Project (macOS)
      - name: Create Host Project (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          HOST_DIR="$PWD/HostProject"
          mkdir -p "$HOST_DIR/Plugins/$PLUGIN_NAME"
          cp -R "$PWD/packaged-plugin/"* "$HOST_DIR/Plugins/$PLUGIN_NAME/"

          cat <<EOF > "$HOST_DIR/HostProject.uproject"
          {
            "FileVersion": 3,
            "EngineAssociation": "$UE_VERSION",
            "Category": "",
            "Description": "",
            "Plugins": [
              {
                "Name": "$PLUGIN_NAME",
                "Enabled": true
              }
            ]
          }
          EOF

      # 4a. Run UAT Automation Tests + OpenCppCoverage (Native Windows Only)
      - name: Run UAT Automation Tests & OpenCppCoverage (Native Windows)
        if: matrix.run_coverage == true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $reportDir = Join-Path $PWD "TestReports"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $sourcesPath = Join-Path $PWD "HostProject\Plugins\$($env:PLUGIN_NAME)\Source"
          $coverageXml = Join-Path $PWD "coverage.xml"
          $uatPath     = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $projectPath = Join-Path $PWD "HostProject\HostProject.uproject"

          & $env:OPENCPP_PATH `
            --sources="$sourcesPath" `
            --modules="UnrealEditor-$($env:PLUGIN_NAME)*.dll" `
            --export_type="cobertura:$coverageXml" `
            --cover_children `
            -- `
            "$uatPath" RunUnreal `
              -project="$projectPath" `
              -platform=Win64 `
              -configuration=Development `
              -build=editor `
              -test=UnrealTest.EditorAutomation `
              -RunTest="$($env:TESTS_FILTER)" `
              -ReportExportPath="$reportDir" `
              -unattended -nop4 -nosplash -nullrhi

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 4b. Run Automated Tests (Linux Cross-Compiled on Windows via WSL2)
      - name: Run Automated Tests (Linux via WSL2)
        if: matrix.run_linux_tests == true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $reportDir = Join-Path $PWD "TestReports"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $uatPath     = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $projectPath = Join-Path $PWD "HostProject\HostProject.uproject"
          $linuxBin    = Join-Path $PWD "HostProject\Saved\StagedBuilds\Linux\HostProject\Binaries\Linux\HostProject"

          & $uatPath BuildCookRun `
            -project="$projectPath" `
            -platform=Linux `
            -clientconfig=Development `
            -build -cook -stage -pak -unattended -nop4

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $wslProjectPath = (wsl wslpath -a "$projectPath").Trim()
          $wslReportPath  = (wsl wslpath -a "$reportDir").Trim()
          $wslBinPath     = (wsl wslpath -a "$linuxBin").Trim()

          wsl "$wslBinPath" `
            "$wslProjectPath" `
            -ExecCmds="Automation RunTests $($env:TESTS_FILTER); Quit" `
            -ReportExportPath="$wslReportPath" `
            -unattended -nop4 -nosplash -nullrhi

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 4c. Run Automated Tests (macOS)
      - name: Run Automated Tests (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PROJECT_FILE="$PWD/HostProject/HostProject.uproject"
          REPORT_DIR="$PWD/TestReports"
          mkdir -p "$REPORT_DIR"

          "$RUN_UAT" RunUnreal \
            -project="$PROJECT_FILE" \
            -platform=Mac \
            -configuration=Development \
            -build=editor \
            -test=UnrealTest.EditorAutomation \
            -RunTest="$TESTS_FILTER" \
            -ReportExportPath="$REPORT_DIR" \
            -unattended -nop4 -nosplash -nullrhi

      # 5. Upload Artifacts
      - name: Upload Build & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_platform }}-Build-And-Reports
          path: |
            packaged-plugin/
            TestReports/
            coverage.xml

      # 6. Upload Coverage to Codecov (Native Windows Only)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: windows-ue58
          fail_ci_if_error: true
          slug: Voidware-Prohibited/Arcana

       # 7a. Update Commit Status on Forgejo (Windows)
      - name: Update Forgejo Commit Status (Windows)
        if: always() && matrix.os == 'windows'
        shell: powershell
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ job.status }}" -eq "success") {
            $state = "success"
            $desc  = "UE $($env:UE_VERSION) build and tests passed on ${{ matrix.target_platform }}"
          } else {
            $state = "failure"
            $desc  = "UE $($env:UE_VERSION) build or tests failed on ${{ matrix.target_platform }}"
          }

          $uri = "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"
          $headers = @{
            Authorization = "token $($env:FORGEJO_TOKEN)"
          }
          $body = @{
            state       = $state
            description = $desc
            context     = "CI / ${{ matrix.name }}"
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType "application/json" -Body $body


      # 7b. Update Commit Status on Forgejo (macOS)
      - name: Update Forgejo Commit Status (macOS)
        if: always() && matrix.os == 'macos'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATE="success"
            DESC="UE $UE_VERSION build and tests passed on ${{ matrix.target_platform }}"
          else
            STATE="failure"
            DESC="UE $UE_VERSION build or tests failed on ${{ matrix.target_platform }}"
          fi

          curl -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$STATE\",\"description\":\"$DESC\",\"context\":\"CI / ${{ matrix.name }}\"}"
