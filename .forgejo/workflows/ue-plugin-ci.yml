name: Cross-platform Unreal Engine Plugin CI

on:
  push:
    branches: [ main, dev ]
    tags:
        - 'v*'
  pull_request:
    branches: [ main, dev ]
    tags:
        - 'v*'

env:
  # Single version variable used across the entire workflow to locate the engine
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TEST_FILTER: "Arcana"
  WINDOWS_TAGS: "win-linux-cross"
  MACOS_TAGS: "macos"
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build-and-test:
    name: ${{ matrix.name }} (UE ${{ env.UE_VERSION }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows
            runner: win-linux-cross
            target_platform: Win64
            run_tests: true
            is_windows: true

          - name: Linux (Cross-Compile)
            os: linux-cross
            runner: win-linux-cross
            target_platform: Linux
            run_tests: false # Cannot execute Linux binaries directly on Windows host
            is_windows: false

          - name: macOS
            os: macos
            runner: macos
            target_platform: Mac
            run_tests: true
            is_windows: false

    steps:
      - name: Checkout Plugin Code
        uses: actions/checkout@v4
        with:
          path: ${{ env.PLUGIN_NAME }}

      - name: Set Engine Paths
        id: paths
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            echo "UAT_PATH=/Users/Shared/Epic Games/UE_${{ env.UE_VERSION }}/Engine/Build/BatchFiles/RunUAT.sh" >> $GITHUB_OUTPUT
            echo "EDITOR_PATH=/Users/Shared/Epic Games/UE_${{ env.UE_VERSION }}/Engine/Binaries/Mac/UnrealEditor-Cmd" >> $GITHUB_OUTPUT
          else
            echo "UAT_PATH=C:/Program Files/Epic Games/UE_${{ env.UE_VERSION }}/Engine/Build/BatchFiles/RunUAT.bat" >> $GITHUB_OUTPUT
            echo "EDITOR_PATH=C:/Program Files/Epic Games/UE_${{ env.UE_VERSION }}/Engine/Binaries/Win64/UnrealEditor-Cmd.exe" >> $GITHUB_OUTPUT
          fi

      - name: Build Plugin (RunUAT)
        shell: bash
        run: |
          "${{ steps.paths.outputs.UAT_PATH }}" BuildPlugin \
            -Plugin="${{ github.workspace }}/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.uplugin" \
            -Package="${{ github.workspace }}/PackagedPlugin_${{ matrix.target_platform }}" \
            -TargetPlatforms=${{ matrix.target_platform }} \
            -Rocket

      - name: Create Host Project for Automation Tests
        if: matrix.run_tests == true
        shell: bash
        run: |
          mkdir -p HostProject/Plugins
          cp -r "PackagedPlugin_${{ matrix.target_platform }}" "HostProject/Plugins/${{ env.PLUGIN_NAME }}"
          cat << 'EOF' > HostProject/HostProject.uproject
          {
            "FileVersion": 3,
            "EngineAssociation": "${{ env.UE_VERSION }}",
            "Plugins": [
              {
                "Name": "${{ env.PLUGIN_NAME }}",
                "Enabled": true
              }
            ]
          }
          EOF

      - name: Run Automation Tests & Code Coverage (Windows)
        if: matrix.is_windows == true && matrix.run_tests == true
        shell: pwsh
        run: |
          OpenCppCoverage.exe `
            --sources "${{ github.workspace }}\${{ env.PLUGIN_NAME }}\Source" `
            --modules "${{ github.workspace }}\HostProject\Plugins\${{ env.PLUGIN_NAME }}\Binaries\Win64" `
            --excluded_sources "*\Intermediate\*" `
            --excluded_sources "*\Tests\*" `
            --export_type cobertura:coverage.xml `
            --cover_children `
            -- "${{ steps.paths.outputs.EDITOR_PATH }}" `
               "${{ github.workspace }}\HostProject\HostProject.uproject" `
               -ExecCmds="Automation RunTests ${{ env.TEST_FILTER }}; Quit" `
               -unattended -nopause -nosplash -nullrhi -stdout

      - name: Run Automation Tests (macOS)
        if: matrix.is_windows == false && matrix.run_tests == true
        shell: bash
        run: |
          "${{ steps.paths.outputs.EDITOR_PATH }}" \
            "${{ github.workspace }}/HostProject/HostProject.uproject" \
            -ExecCmds="Automation RunTests ${{ env.TEST_FILTER }}; Quit" \
            -unattended -nopause -nosplash -nullrhi -stdout

      - name: Upload Packaged Plugin Artifact (Windows Only)
        if: matrix.is_windows == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-UE${{ env.UE_VERSION }}-Win64
          path: PackagedPlugin_Win64/

      - name: Upload Coverage to Codecov (Windows Only)
        if: matrix.is_windows == true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
