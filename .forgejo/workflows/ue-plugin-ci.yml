name: UE 5.8 Plugin Build & Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (Native)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Win64
            run_coverage: true
            run_linux_tests: false

          - name: "Linux (Cross-Compiled on Windows)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Linux
            run_coverage: false
            run_linux_tests: true

          - name: "macOS (Native)"
            os: macos
            runs-on: macos
            target_platform: Mac
            run_coverage: false
            run_linux_tests: false

    steps:
      # 0. Install Dependencies (Native per OS)
      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command git-lfs -ErrorAction SilentlyContinue)) {
            winget install -e --id GitHub.GitLFS --accept-package-agreements --accept-source-agreements
          }
          git lfs install

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          if ! command -v git-lfs &> /dev/null; then
            brew install git-lfs
          fi
          git lfs install

      # 1. Checkout Plugin Code
      - name: Checkout Plugin Code
        uses: actions/checkout@v4
        with:
          path: plugin-src
          lfs: true

      # 2a. Build Plugin via RunUAT (Windows)
      - name: Build Plugin (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $RunUAT = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $PluginFile = Join-Path $PWD "plugin-src\$($env:PLUGIN_NAME).uplugin"
          $PackageDir = Join-Path $PWD "packaged-plugin"

          & $RunUAT BuildPlugin `
            -Plugin="$PluginFile" `
            -Package="$PackageDir" `
            -TargetPlatforms=${{ matrix.target_platform }} `
            -Rocket

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 2b. Build Plugin via RunUAT (macOS)
      - name: Build Plugin (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PLUGIN_FILE="$PWD/plugin-src/$PLUGIN_NAME.uplugin"
          PACKAGE_DIR="$PWD/packaged-plugin"

          "$RUN_UAT" BuildPlugin \
            -Plugin="$PLUGIN_FILE" \
            -Package="$PACKAGE_DIR" \
            -TargetPlatforms=${{ matrix.target_platform }} \
            -Rocket

      # 3a. Create Blank C++ Host Project (Windows)
      - name: Create Host Project (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $HostDir = Join-Path $PWD "HostProject"
          $PluginDest = Join-Path $HostDir "Plugins\$($env:PLUGIN_NAME)"
          New-Item -ItemType Directory -Force -Path $PluginDest | Out-Null
          Copy-Item -Path "$PWD\packaged-plugin\*" -Destination $PluginDest -Recurse -Force

          $UProjectContent = @"
          {
            "FileVersion": 3,
            "EngineAssociation": "$($env:UE_VERSION)",
            "Category": "",
            "Description": "",
            "Plugins": [
              {
                "Name": "$($env:PLUGIN_NAME)",
                "Enabled": true
              }
            ]
          }
          "@
          Set-Content -Path (Join-Path $HostDir "HostProject.uproject") -Value $UProjectContent -Encoding UTF8

      # 3b. Create Blank C++ Host Project (macOS)
      - name: Create Host Project (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          HOST_DIR="$PWD/HostProject"
          mkdir -p "$HOST_DIR/Plugins/$PLUGIN_NAME"
          cp -R "$PWD/packaged-plugin/"* "$HOST_DIR/Plugins/$PLUGIN_NAME/"

          cat <<EOF > "$HOST_DIR/HostProject.uproject"
          {
            "FileVersion": 3,
            "EngineAssociation": "$UE_VERSION",
            "Category": "",
            "Description": "",
            "Plugins": [
              {
                "Name": "$PLUGIN_NAME",
                "Enabled": true
              }
            ]
          }
          EOF

      # 4a. Run UAT Automation Tests + OpenCppCoverage (Native Windows Only)
      - name: Run UAT Automation Tests & OpenCppCoverage (Native Windows)
        if: matrix.run_coverage == true
        shell: pwsh
        run: |
          $RunUAT = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $ProjectFile = Join-Path $PWD "HostProject\HostProject.uproject"
          $ReportDir = Join-Path $PWD "TestReports"
          $CoverageFile = Join-Path $PWD "coverage.xml"
          $SourcesDir = Join-Path $PWD "HostProject\Plugins\$($env:PLUGIN_NAME)\Source"
          New-Item -ItemType Directory -Force -Path $ReportDir | Out-Null

          & $env:OPENCPP_PATH `
            --sources="$SourcesDir" `
            --modules="UnrealEditor-$($env:PLUGIN_NAME)*.dll" `
            --export_type="cobertura:$CoverageFile" `
            --cover_children `
            -- `
            $RunUAT RunUnreal `
              -project="$ProjectFile" `
              -platform=Win64 `
              -configuration=Development `
              -build=editor `
              -test=UE.EditorAutomation `
              -RunTest="$($env:TESTS_FILTER)" `
              -ReportExportPath="$ReportDir" `
              -unattended -nop4 -nosplash -nullrhi

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 4b. Run Automated Tests (Linux Cross-Compiled on Windows via WSL2)
      - name: Run Automated Tests (Linux via WSL2)
        if: matrix.run_linux_tests == true
        shell: pwsh
        run: |
          $RunUAT = Join-Path $env:WIN_UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $ProjectFile = Join-Path $PWD "HostProject\HostProject.uproject"
          $ReportDir = Join-Path $PWD "TestReports"
          New-Item -ItemType Directory -Force -Path $ReportDir | Out-Null

          & $RunUAT BuildCookRun `
            -project="$ProjectFile" `
            -platform=Linux `
            -clientconfig=Development `
            -build -cook -stage -pak -unattended -nop4

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $LinuxBinWinPath = Join-Path $PWD "HostProject\Saved\StagedBuilds\Linux\HostProject\Binaries\Linux\HostProject"
          $WslProjectPath = (wsl wslpath -a "$ProjectFile").Trim()
          $WslReportPath = (wsl wslpath -a "$ReportDir").Trim()
          $WslBinPath = (wsl wslpath -a "$LinuxBinWinPath").Trim()

          wsl "$WslBinPath" `
            "$WslProjectPath" `
            -ExecCmds="Automation RunTests $($env:TESTS_FILTER); Quit" `
            -ReportExportPath="$WslReportPath" `
            -unattended -nop4 -nosplash -nullrhi

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 4c. Run Automated Tests (macOS)
      - name: Run Automated Tests (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PROJECT_FILE="$PWD/HostProject/HostProject.uproject"
          REPORT_DIR="$PWD/TestReports"
          mkdir -p "$REPORT_DIR"

          "$RUN_UAT" RunUnreal \
            -project="$PROJECT_FILE" \
            -platform=Mac \
            -configuration=Development \
            -build=editor \
            -test=UE.EditorAutomation \
            -RunTest="$TESTS_FILTER" \
            -ReportExportPath="$REPORT_DIR" \
            -unattended -nop4 -nosplash -nullrhi

      # 5. Upload Artifacts
      - name: Upload Build & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_platform }}-Build-And-Reports
          path: |
            packaged-plugin/
            TestReports/
            coverage.xml

      # 6. Upload Coverage to Codecov (Native Windows Only)
      - name: Upload Coverage to Codecov
        if: matrix.run_coverage == true && success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: windows-ue58
          fail_ci_if_error: true

      # 7a. Update Commit Status on Forgejo (Windows)
      - name: Update Forgejo Commit Status (Windows)
        if: always() && matrix.os == 'windows'
        shell: pwsh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if ("${{ job.status }}" -eq "success") {
            $State = "success"
            $Desc = "UE $($env:UE_VERSION) build and tests passed on ${{ matrix.target_platform }}"
          } else {
            $State = "failure"
            $Desc = "UE $($env:UE_VERSION) build or tests failed on ${{ matrix.target_platform }}"
          }

          $Body = @{
            state = $State
            description = $Desc
            context = "CI / ${{ matrix.name }}"
          } | ConvertTo-Json

          $Headers = @{
            Authorization = "token $($env:FORGEJO_TOKEN)"
            "Content-Type" = "application/json"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -Headers $Headers `
            -Body $Body

