name: UE 5.8 Plugin Build & Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (Native)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Win64
            run_coverage: true
            run_linux_tests: false

          - name: "Linux (Cross-Compiled on Windows)"
            os: windows
            runs-on: win-linux-cross
            target_platform: Linux
            run_coverage: false
            run_linux_tests: true

          - name: "macOS (Native)"
            os: macos
            runs-on: macos
            target_platform: Mac
            run_coverage: false
            run_linux_tests: false

    steps:
      # 0. Install Dependencies (Native per OS)
      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          if (-not (Get-Command git-lfs -ErrorAction SilentlyContinue)) {
            winget install -e --id GitHub.GitLFS --accept-package-agreements --accept-source-agreements
          }
          git lfs install

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          if ! command -v git-lfs &> /dev/null; then
            brew install git-lfs
          fi
          git lfs install

      # 1. Checkout Plugin Code
      - name: Checkout Plugin Code
        shell: powershell
        run: |
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}.git"
          $authUrl = $repoUrl -replace "https://", "https://oauth2:${{ secrets.GITHUB_TOKEN }}@"
          
          git clone --depth 1 --no-checkout $authUrl plugin-src
          Set-Location plugin-src
          
          git lfs install --local
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
          git lfs pull

      # 2a. Build Plugin via RunUAT (Windows)
      - name: Build Plugin (Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "%WIN_UE_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" BuildPlugin ^
            -Plugin="%CD%\plugin-src\%PLUGIN_NAME%.uplugin" ^
            -Package="%CD%\packaged-plugin" ^
            -TargetPlatforms=${{ matrix.target_platform }} ^
            -Rocket
          if %errorlevel% neq 0 exit /b %errorlevel%

      # 2b. Build Plugin via RunUAT (macOS)
      - name: Build Plugin (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PLUGIN_FILE="$PWD/plugin-src/$PLUGIN_NAME.uplugin"
          PACKAGE_DIR="$PWD/packaged-plugin"

          "$RUN_UAT" BuildPlugin \
            -Plugin="$PLUGIN_FILE" \
            -Package="$PACKAGE_DIR" \
            -TargetPlatforms=${{ matrix.target_platform }} \
            -Rocket

      # 3a. Create Blank C++ Host Project (Windows)
      - name: Create Host Project (Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          mkdir "%CD%\HostProject\Plugins\%PLUGIN_NAME%"
          xcopy "%CD%\packaged-plugin\*" "%CD%\HostProject\Plugins\%PLUGIN_NAME%\" /E /I /Y /Q

          (
            echo {
            echo   "FileVersion": 3,
            echo   "EngineAssociation": "%UE_VERSION%",
            echo   "Category": "",
            echo   "Description": "",
            echo   "Plugins": [
            echo     {
            echo       "Name": "%PLUGIN_NAME%",
            echo       "Enabled": true
            echo     }
            echo   ]
            echo }
          ) > "%CD%\HostProject\HostProject.uproject"

      # 3b. Create Blank C++ Host Project (macOS)
      - name: Create Host Project (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          HOST_DIR="$PWD/HostProject"
          mkdir -p "$HOST_DIR/Plugins/$PLUGIN_NAME"
          cp -R "$PWD/packaged-plugin/"* "$HOST_DIR/Plugins/$PLUGIN_NAME/"

          cat <<EOF > "$HOST_DIR/HostProject.uproject"
          {
            "FileVersion": 3,
            "EngineAssociation": "$UE_VERSION",
            "Category": "",
            "Description": "",
            "Plugins": [
              {
                "Name": "$PLUGIN_NAME",
                "Enabled": true
              }
            ]
          }
          EOF

      # 4a. Run UAT Automation Tests + OpenCppCoverage (Native Windows Only)
      - name: Run UAT Automation Tests & OpenCppCoverage (Native Windows)
        if: matrix.run_coverage == true
        shell: cmd
        run: |
          mkdir "%CD%\TestReports"

          "%OPENCPP_PATH%" ^
            --sources="%CD%\HostProject\Plugins\%PLUGIN_NAME%\Source" ^
            --modules="UnrealEditor-%PLUGIN_NAME%*.dll" ^
            --export_type="cobertura:%CD%\coverage.xml" ^
            --cover_children ^
            -- ^
            "%WIN_UE_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" RunUnreal ^
              -project="%CD%\HostProject\HostProject.uproject" ^
              -platform=Win64 ^
              -configuration=Development ^
              -build=editor ^
              -test=UE.EditorAutomation ^
              -RunTest="%TESTS_FILTER%" ^
              -ReportExportPath="%CD%\TestReports" ^
              -unattended -nop4 -nosplash -nullrhi
          if %errorlevel% neq 0 exit /b %errorlevel%

      # 4b. Run Automated Tests (Linux Cross-Compiled on Windows via WSL2)
      - name: Run Automated Tests (Linux via WSL2)
        if: matrix.run_linux_tests == true
        shell: cmd
        run: |
          mkdir "%CD%\TestReports"

          call "%WIN_UE_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
            -project="%CD%\HostProject\HostProject.uproject" ^
            -platform=Linux ^
            -clientconfig=Development ^
            -build -cook -stage -pak -unattended -nop4
          if %errorlevel% neq 0 exit /b %errorlevel%

          for /f "delims=" %%i in ('wsl wslpath -a "%CD%\HostProject\HostProject.uproject"') do set "WSL_PROJECT_PATH=%%i"
          for /f "delims=" %%i in ('wsl wslpath -a "%CD%\TestReports"') do set "WSL_REPORT_PATH=%%i"
          for /f "delims=" %%i in ('wsl wslpath -a "%CD%\HostProject\Saved\StagedBuilds\Linux\HostProject\Binaries\Linux\HostProject"') do set "WSL_BIN_PATH=%%i"

          wsl "%WSL_BIN_PATH%" ^
            "%WSL_PROJECT_PATH%" ^
            -ExecCmds="Automation RunTests %TESTS_FILTER%; Quit" ^
            -ReportExportPath="%WSL_REPORT_PATH%" ^
            -unattended -nop4 -nosplash -nullrhi
          if %errorlevel% neq 0 exit /b %errorlevel%

      # 4c. Run Automated Tests (macOS)
      - name: Run Automated Tests (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          RUN_UAT="$MAC_UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          PROJECT_FILE="$PWD/HostProject/HostProject.uproject"
          REPORT_DIR="$PWD/TestReports"
          mkdir -p "$REPORT_DIR"

          "$RUN_UAT" RunUnreal \
            -project="$PROJECT_FILE" \
            -platform=Mac \
            -configuration=Development \
            -build=editor \
            -test=UE.EditorAutomation \
            -RunTest="$TESTS_FILTER" \
            -ReportExportPath="$REPORT_DIR" \
            -unattended -nop4 -nosplash -nullrhi

      # 5. Upload Artifacts
      - name: Upload Build & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_platform }}-Build-And-Reports
          path: |
            packaged-plugin/
            TestReports/
            coverage.xml

      # 6. Upload Coverage to Codecov (Native Windows Only)
      - name: Upload Coverage to Codecov
        if: matrix.run_coverage == true && success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: windows-ue58
          fail_ci_if_error: true

      # 7a. Update Commit Status on Forgejo (Windows)
      - name: Update Forgejo Commit Status (Windows)
        if: always() && matrix.os == 'windows'
        shell: cmd
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if "${{ job.status }}"=="success" (
            set "STATE=success"
            set "DESC=UE %UE_VERSION% build and tests passed on ${{ matrix.target_platform }}"
          ) else (
            set "STATE=failure"
            set "DESC=UE %UE_VERSION% build or tests failed on ${{ matrix.target_platform }}"
          )

          curl.exe -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" ^
            -H "Authorization: token %FORGEJO_TOKEN%" ^
            -H "Content-Type: application/json" ^
            -d "{\"state\":\"%STATE%\",\"description\":\"%DESC%\",\"context\":\"CI / ${{ matrix.name }}\"}"

      # 7b. Update Commit Status on Forgejo (macOS)
      - name: Update Forgejo Commit Status (macOS)
        if: always() && matrix.os == 'macos'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATE="success"
            DESC="UE $UE_VERSION build and tests passed on ${{ matrix.target_platform }}"
          else
            STATE="failure"
            DESC="UE $UE_VERSION build or tests failed on ${{ matrix.target_platform }}"
          fi

          curl -s -X POST "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$STATE\",\"description\":\"$DESC\",\"context\":\"CI / ${{ matrix.name }}\"}"
