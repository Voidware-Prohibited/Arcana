name: Export Wiki to GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Publish Wiki
    runs-on: linux
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Checkout Local Forgejo Wiki Repository
        run: |
          # Forgejo stores wikis as a separate git repo named <repo-name>.wiki.git
          # We clone it locally into a temporary directory
          git clone "https://x-access-token:${{ github.token }}@git.voidwarex.com/${{ github.repository }}.wiki.git" local_wiki

      - name: Setup mdBook
        run: |
          # Define standard version tag
          TAG_VERSION="v0.5.4"
          
          mkdir -p build_bin
          
          # Fixed URL layout with the mandatory missing slash added after github.com
          URL="https://github.com/rust-lang/mdBook/releases/download/${TAG_VERSION}/mdbook-${TAG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading from: $URL"
          
          # Securely stream and unpack the archive straight into the runner workspace
          wget --no-check-certificate -qO- "$URL" | tar -xz -C build_bin/ || {
            echo "Download stream aborted or broken. Verify instance gateway paths."
            exit 1
          }
          
          chmod +x build_bin/mdbook
          echo "$(pwd)/build_bin" >> $GITHUB_PATH

      - name: Initialize and Build mdBook
        run: |
          mkdir -p local_wiki/src
          
          if [ ! -f local_wiki/book.toml ]; then
            cat <<EOF > local_wiki/book.toml
          [book]
          title = "${{ github.event.repository.name }} Wiki"
          authors = ["Uriel Ballinas, VOIDWARE Prohibited"]
          language = "en"
          src = "src"

          [output.html]
          git-repository-url = "https://github.com/${{ vars.GHPAGES_REPO }}"
          site-url = "/wiki/"
          EOF
          fi

          # Ensure files are inside src/
          find local_wiki -maxdepth 1 -name "*.md" -exec mv {} local_wiki/src/ \;

          if [ ! -f local_wiki/src/SUMMARY.md ]; then
            echo "# Summary" > local_wiki/src/SUMMARY.md
            find local_wiki/src -name "*.md" ! -name "SUMMARY.md" -exec basename {} .md \; | while read -r file; do
              name=$(echo "$file" | tr '-' ' ' | tr '_' ' ')
              echo "- [$name]($file.md)" >> local_wiki/src/SUMMARY.md
            done
          fi

          # Force mdbook to build to a clean absolute path outside the wiki directory
          mkdir -p ${{ github.workspace }}/html_compiled
          mdbook build local_wiki --dest-dir ${{ github.workspace }}/html_compiled

      - name: Deploy to Remote GitHub Pages Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REMOTE_REPO: ${{ vars.GHPAGES_REPO }}
        run: |
          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "forgejo-actions[bot]@://github.com"

          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${REMOTE_REPO}" github_repo
          
          mkdir -p github_repo/wiki
          rm -rf github_repo/wiki/*

          # Copy directly from the verified absolute output directory
          cp -r ${{ github.workspace }}/html_compiled/* github_repo/wiki/

          cd github_repo
          
          # Initialize branch context if the remote target is completely blank
          git checkout -b main 2>/dev/null || git checkout main
          
          git add wiki/
          if git diff-index --quiet HEAD; then
            echo "No wiki changes detected. Skipping push."
          else
            git commit -m "Automated synchronization update: Forgejo wiki to /wiki subfolder"
            git push origin main
          fi
