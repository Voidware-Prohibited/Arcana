name: Dev CI/CD Pipeline
on:
  push:
    branches: [ stable ]
    tags:
      - 'v*'
  pull_request:
    branches: [ stable ]
    tags:
      - 'v*'

env:
  UE_VERSION: "5.8"
  PLUGIN_NAME: "Arcana"
  TESTS_FILTER: "Arcana."
  WIN_UE_ROOT: 'D:\DEV\UE5\UE_5.8'
  MAC_UE_ROOT: "/Users/Shared/Epic Games/UE_5.8"
  OPENCPP_PATH: 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe'
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  step-1-test-environment:
    name: Test Environment for Dependencies
    uses: ./.forgejo/workflows/test-win-env.yml

  step-2-build:
    needs: step-1-test-environment
    name: Build, Test, Cook, Package and Update Status
    uses: ./.forgejo/workflows/ue-plugin-ci-release.yml
    secrets: inherit

  step-3-generate-and-publish-documentation:
    needs: step-2-build
    name: Generate Doxygen Documentation and Publish to Website
    uses: ./.forgejo/workflows/publish-doxygen.yml
    secrets: inherit 

  step-4-publish-wiki-to-site
    needs: step-2-build
    name: Publish Wiki to Website
    uses: ./.forgejo/workflows/publish-wiki.yml
    secrets: inherit 
