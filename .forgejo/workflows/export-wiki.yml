name: Export Wiki to GitHub Pages

on:
  push:
    branches:
      - main # Change to your default branch name if different

jobs:
  build-and-deploy:
    runs-on: linux
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Checkout Local Forgejo Wiki Repository
        run: |
          # Forgejo stores wikis as a separate git repo named <repo-name>.wiki.git
          # We clone it locally into a temporary directory
          git clone "https://x-access-token:${{ github.token }}@git.voidwarex.com/${{ github.repository }}.wiki.git" local_wiki

      - name: Setup mdBook
        run: |
          # 1. Use a hardcoded stable version to guarantee a reliable download link
          VERSION="v0.4.40"
          echo "Fetching mdBook version: ${VERSION}"
          
          # 2. Build local binary directories safely in user space
          mkdir -p build_bin
          
          # 3. Download the specific static linux binary
          wget -qO- "https://github.com{VERSION}/mdbook-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C build_bin/
          
          # 4. Make it executable and map it to the active runner pathway
          chmod +x build_bin/mdbook
          echo "$(pwd)/build_bin" >> $GITHUB_PATH

      - name: Initialize and Build mdBook
        run: |
          # Create a basic mdBook configuration if it doesn't exist
          if [ ! -f local_wiki/book.toml ]; then
            cat <<EOF > local_wiki/book.toml
          [book]
          title = "${{ github.repository }} Wiki"
          author = "Uriel Ballinas, VOIDWARE Prohibited"
          language = "en"

          [output.html]
          git-repository-url = "https://${{ vars.GHPAGES_REPO }}"
          site-url = "/wiki/"
          EOF
          fi

          # Generate the SUMMARY.md dynamically if it doesn't exist to map wiki files
          if [ ! -f local_wiki/SUMMARY.md ]; then
            echo "# Summary" > local_wiki/SUMMARY.md
            find local_wiki -name "*.md" ! -name "SUMMARY.md" -exec basename {} .md \; | while read -r file; do
              # Clean up naming formatting for the sidebar links
              name=$(echo "$file" | tr '-' ' ' | tr '_' ' ')
              echo "- [$name]($file.md)" >> local_wiki/SUMMARY.md
            done
          fi

          # Build the markdown files into static HTML
          mdbook build local_wiki --dest-dir build_output

      - name: Deploy to Remote GitHub Pages Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REMOTE_REPO: ${{ vars.GHPAGES_REPO }}
        run: |
          # Configure basic Git identification
          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "forgejo-actions[bot]@users.noreply.github.com"

          # Clone the remote GitHub target repository safely
          git clone "https://x-access-token:${GITHUB_TOKEN}@${REMOTE_REPO}" github_repo
          
          # Ensure target subdirectory path exists and clean old wiki deployment assets
          mkdir -p github_repo/wiki
          rm -rf github_repo/wiki/*

          # Copy compiled mdBook HTML output directly into the target subdirectory
          cp -r local_wiki/build_output/* github_repo/wiki/

          # Commit and Push updates back to the remote GitHub repository
          cd github_repo
          git add wiki/
          if git diff-index --quiet HEAD; then
            echo "No wiki changes detected. Skipping push."
          else
            git commit -m "Automated synchronization update: Forgejo wiki to /wiki subfolder"
            git push origin stable
          fi
